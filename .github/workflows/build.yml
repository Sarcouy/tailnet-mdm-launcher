name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a working Android SDK (ANDROID_HOME set, licences accepted),
      # so Gradle resolves the SDK on its own; no setup action needed.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleOpensourceDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tailnet-mdm-launcher-debug
          path: app/build/outputs/apk/opensource/debug/*.apk
          if-no-files-found: error
